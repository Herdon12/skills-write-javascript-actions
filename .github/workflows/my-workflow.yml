name: JS Actions

on:
  push:
    branches:
      - main  # Change this to the branch you want to trigger the action on

jobs:
  action:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'  # Specify the version of Node.js you want to use

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test  # This can be adjusted depending on your action's needs

